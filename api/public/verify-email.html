<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passerelle SMS — Vérification e-mail</title>
  <link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__">
</head>
<body class="center">
  <div class="card" style="max-width:420px;text-align:center">
    <span class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
    <h1 id="title">Vérification en cours…</h1>
    <p id="message" class="muted">Un instant.</p>
    <p><a href="/login.html">Retour à la connexion</a></p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      const titleEl = document.getElementById('title');
      const messageEl = document.getElementById('message');
      if (!token) {
        titleEl.textContent = 'Lien invalide';
        messageEl.textContent = 'Aucun jeton de vérification fourni.';
        return;
      }
      fetch('/admin/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      })
        .then(async (res) => ({ ok: res.ok, data: await res.json().catch(() => ({})) }))
        .then(({ ok, data }) => {
          if (ok) {
            titleEl.textContent = 'Compte activé';
            messageEl.textContent = `Votre adresse e-mail est vérifiée${data.login ? ` (${data.login})` : ''}. Vous pouvez vous connecter.`;
          } else {
            titleEl.textContent = 'Vérification impossible';
            messageEl.textContent = data.error || 'Ce lien est invalide ou a expiré.';
          }
        })
        .catch(() => {
          titleEl.textContent = 'Vérification impossible';
          messageEl.textContent = 'Erreur de connexion au serveur.';
        });
    })();
  </script>
</body>
</html>
