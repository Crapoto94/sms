<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passerelle SMS — Connexion</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="center">
  <form id="loginForm" class="card">
    <h1>Passerelle SMS</h1>
    <p class="muted">Console d'administration</p>
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autofocus autocomplete="current-password">
    <p style="margin-top:16px"><button type="submit" style="width:100%">Se connecter</button></p>
    <p id="error" class="error"></p>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value })
      });
      if (res.ok) {
        location.href = '/';
      } else {
        document.getElementById('error').textContent = 'Mot de passe incorrect';
      }
    });
  </script>
</body>
</html>
