<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passerelle SMS — Connexion</title>
  <link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__">
</head>
<body class="center">
  <button id="btnTheme" class="ghost" style="position:fixed;top:16px;right:16px">Mode clair</button>
  <form id="loginForm" class="card">
    <h1>Passerelle SMS</h1>
    <p class="muted">Console d'administration et d'envoi de SMS</p>
    <label for="login">Identifiant <span class="muted">(laisser vide pour le compte admin)</span></label>
    <input id="login" type="text" autocomplete="username" autofocus>
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password">
    <p style="margin-top:16px"><button type="submit" style="width:100%">Se connecter</button></p>
    <p id="error" class="error"></p>
  </form>
  <script>
    (function initTheme() {
      const btn = document.getElementById('btnTheme');
      const apply = (light) => {
        document.body.classList.toggle('light', light);
        btn.textContent = light ? 'Mode sombre' : 'Mode clair';
      };
      apply(localStorage.getItem('sms-theme') === 'light');
      btn.addEventListener('click', () => {
        const light = !document.body.classList.contains('light');
        localStorage.setItem('sms-theme', light ? 'light' : 'dark');
        apply(light);
      });
    })();
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('login').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        location.href = data.isAdmin ? '/' : '/send.html';
      } else {
        document.getElementById('error').textContent = data.error || 'Connexion impossible';
      }
    });
  </script>
</body>
</html>
