<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Passerelle SMS — Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    /* Habillage sobre, aligné sur la console (page autonome : aucun style externe). */
    body { margin: 0; background: #f7f8fa; }
    body, .swagger-ui { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .docs-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: #fff;
      border-bottom: 1px solid #e7e9ee;
      color: #14161b;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .docs-bar .mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(160deg, #5578f2, #3350d8);
      color: #fff;
    }
    .docs-bar .mark svg { width: 15px; height: 15px; display: block; }
    .docs-bar small { margin-left: auto; font-size: 12.5px; font-weight: 400; color: #6c7280; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 26px 0 18px; }
    .swagger-ui .scheme-container { background: transparent; box-shadow: none; padding: 12px 0; }
    .swagger-ui .opblock { border-radius: 10px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
    .swagger-ui .btn { border-radius: 8px; }
  </style>
</head>
<body>
  <div class="docs-bar">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
    Passerelle SMS
    <small>Documentation de l'API</small>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      fetch('/openapi.json')
        .then((r) => r.json())
        .then((spec) => {
          spec.servers = [{ url: window.location.origin, description: 'Serveur API de la passerelle' }];
          SwaggerUIBundle({
            spec: spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: 'StandaloneLayout',
            persistAuthorization: true
          });
        });
    };
  </script>
</body>
</html>
