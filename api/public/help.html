<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passerelle SMS — Aide</title>
  <link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__">
</head>
<body>
  <header>
    <div class="header-brand">
      <h1><a class="brand" href="/login.html"><span class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>Passerelle SMS</a></h1>
      <span class="muted">Aide — architecture &amp; fonctionnement</span>
    </div>
    <div class="header-actions">
      <a class="ghost" href="/docs" target="_blank" rel="noopener">Docs API</a>
      <button id="btnTheme" class="ghost">Mode clair</button>
      <a class="ghost" href="/login.html">Retour à la console</a>
    </div>
  </header>

  <main>
    <section id="help" class="panel">
      <!-- __HELP_CONTENT__ -->
    </section>
  </main>

  <script>
    (function initTheme() {
      const btn = document.getElementById('btnTheme');
      const apply = (light) => {
        document.body.classList.toggle('light', light);
        btn.textContent = light ? 'Mode sombre' : 'Mode clair';
      };
      apply(localStorage.getItem('sms-theme') === 'light');
      btn.addEventListener('click', () => {
        const light = !document.body.classList.contains('light');
        localStorage.setItem('sms-theme', light ? 'light' : 'dark');
        apply(light);
      });
    })();
  </script>
</body>
</html>
