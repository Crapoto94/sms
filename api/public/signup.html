<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passerelle SMS — Créer un compte</title>
  <link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__">
</head>
<body class="center">
  <button id="btnTheme" class="ghost" style="position:fixed;top:16px;right:16px">Mode clair</button>
  <form id="signupForm" class="card" style="max-width:420px">
    <span class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
    <h1>Créer votre organisation</h1>
    <p class="muted">Un espace isolé pour vos messages, vos jetons API et vos passerelles.</p>
    <label for="organisation">Nom de l'organisation</label>
    <input id="organisation" type="text" autocomplete="organization" required maxlength="80">
    <label for="login">Identifiant</label>
    <input id="login" type="text" autocomplete="username" required maxlength="32" pattern="[a-zA-Z0-9._-]{3,32}">
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Mot de passe <span class="muted">(8 caractères minimum)</span></label>
    <input id="password" type="password" autocomplete="new-password" required minlength="8">
    <p style="margin-top:16px"><button type="submit" style="width:100%">Créer le compte</button></p>
    <p id="error" class="error"></p>
    <p id="success" style="color:var(--tone-ok-fg)" hidden></p>
    <p class="muted" style="text-align:center">Déjà un compte ? <a href="/login.html">Se connecter</a></p>
  </form>
  <script>
    (function initTheme() {
      const btn = document.getElementById('btnTheme');
      // Sans choix explicite mémorisé, on suit la préférence système (gérée
      // en CSS, cf. @media (prefers-color-scheme: light) dans style.css)
      // plutôt que d'imposer le sombre par défaut.
      const mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
      const effectiveLight = () => {
        const stored = localStorage.getItem('sms-theme');
        if (stored === 'light') return true;
        if (stored === 'dark') return false;
        return mql ? mql.matches : false;
      };
      const apply = (light) => {
        document.body.classList.toggle('light', light);
        document.body.classList.toggle('dark', !light);
        btn.textContent = light ? 'Mode sombre' : 'Mode clair';
      };
      const stored = localStorage.getItem('sms-theme');
      if (stored === 'light' || stored === 'dark') {
        apply(stored === 'light');
      } else {
        btn.textContent = effectiveLight() ? 'Mode sombre' : 'Mode clair';
      }
      btn.addEventListener('click', () => {
        const light = !effectiveLight();
        localStorage.setItem('sms-theme', light ? 'light' : 'dark');
        apply(light);
      });
    })();
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      errorEl.textContent = '';
      successEl.hidden = true;
      const res = await fetch('/admin/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          organisation: document.getElementById('organisation').value,
          login: document.getElementById('login').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        document.getElementById('signupForm').querySelectorAll('input,button').forEach((el) => el.disabled = true);
        successEl.hidden = false;
        successEl.textContent = data.message || 'Compte créé. Vérifiez votre boîte mail pour l’activer.';
      } else {
        errorEl.textContent = data.error || 'Création de compte impossible';
      }
    });
  </script>
</body>
</html>
